name: Windows customizable export

on:
  push:
    branches: [codex/customizable-export]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-custom-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-package:
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      # Keep debug/test artifacts small on the hosted runner's limited disk.
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked frontend dependencies
        run: |
          npm install --global pnpm@10.30.3
          if ($LASTEXITCODE -ne 0) { throw 'pnpm installation failed.' }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Locked frontend dependency installation failed.' }

      - name: Prepare the pinned Rust toolchain and offline dependencies
        run: |
          $toolchain = Get-Content -LiteralPath rust-toolchain.toml -Raw
          $channel = [regex]::Match($toolchain, '(?m)^channel\s*=\s*"([^"]+)"').Groups[1].Value
          if (-not $channel) { throw 'No pinned Rust channel found in rust-toolchain.toml.' }
          rustup toolchain install $channel --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust installation failed.' }
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { throw 'Locked Rust dependency download failed.' }

      - name: Check WebView2 for isolated desktop acceptance
        run: |
          $registryPaths = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $versions = @($registryPaths | ForEach-Object {
            $version = (Get-ItemProperty -LiteralPath $_ -Name pv -ErrorAction SilentlyContinue).pv
            if ($version -and $version -ne '0.0.0.0') { $version }
          })
          if ($versions.Count -eq 0) { throw 'The runner needs Microsoft Edge WebView2 Runtime for desktop acceptance.' }
          Write-Host ('WebView2: ' + ($versions -join ', '))

      # Bootstrap only: import the resulting patch into the source branch, then
      # replace this step with cargo fmt --all -- --check for final validation.
      - name: Prepare rustfmt patch for initial Windows validation
        id: format
        run: |
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { throw 'Rust formatting failed.' }
          New-Item -ItemType Directory -Path target -Force | Out-Null
          git diff --binary --output=target/ci-rustfmt.patch -- '*.rs'
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the Rust formatting patch.' }
          if ((Get-Item -LiteralPath target/ci-rustfmt.patch).Length -gt 0) {
            'changed=true' >> $env:GITHUB_OUTPUT
            Write-Warning 'Rust formatting was applied in CI. Import ci-rustfmt.patch and rerun with strict format checking before final delivery.'
            'Rust formatting changed: import the ci-rustfmt.patch artifact, commit it, and rerun strict format validation before final delivery.' >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload formatting patch
        if: ${{ always() && steps.format.outputs.changed == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          path: target/ci-rustfmt.patch
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Verify and package the Windows x64 application
        run: ./scripts/package-release.ps1 -PackageName ci-customizable-export-windows-x64

      - name: Upload the single executable
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/ci-customizable-export-windows-x64/WeComArchive.exe
          archive: false
          if-no-files-found: error
          retention-days: 7
